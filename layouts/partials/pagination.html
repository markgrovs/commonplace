{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="Page navigation">
    {{ with .Prev }}<a href="{{ .URL }}" rel="prev">← Newer</a>{{ end }}
    <span>Page {{ .PageNumber }} of {{ .TotalPages }}</span>
    {{ with .Next }}<a href="{{ .URL }}" rel="next">Older →</a>{{ end }}
</nav>
{{ end }}
