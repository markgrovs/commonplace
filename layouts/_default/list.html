{{ define "main" }}
<section>
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="intro">{{ . }}</div>{{ end }}
    {{ if .Pages }}
        {{ $paginator := .Paginate .Pages 10 }}
        {{ partial "entry-list.html" $paginator.Pages }}
        {{ partial "pagination.html" $paginator }}
    {{ else }}<p>There is nothing here yet.</p>{{ end }}
</section>
{{ end }}
